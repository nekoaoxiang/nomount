name: Build BBR LKM Module

on:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260313'
        type: string
  workflow_call:
    inputs:
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260313'
        type: string

jobs:
  build-bbr:
    name: Build tcp_bbr.ko for ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android14-6.1
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release || '20260313' }}

    steps:
      - name: Build tcp_bbr.ko
        run: |
          set -euo pipefail
          echo "=== Building self-contained tcp_bbr.ko for KMI: ${{ matrix.kmi }} ==="

          WORKDIR=/tmp/bbr_build
          mkdir -p $WORKDIR
          cd $WORKDIR

          SRC_BASE=/opt/ddk/src/${{ matrix.kmi }}

          # 1. 复制源码文件
          cp $SRC_BASE/net/ipv4/tcp_bbr.c ./tcp_bbr_main.c

          MINMAX_SRC=$(find $SRC_BASE -type f \( -name "minmax.c" -o -name "win_minmax.c" \) | head -n 1)
          if [ -z "$MINMAX_SRC" ]; then
              echo "ERROR: Could not find minmax source file in $SRC_BASE!"
              exit 1
          fi
          cp "$MINMAX_SRC" ./minmax.c

          # 2. 生成统一的注入头文件 (替代 sed/grep，安全预定义打桩宏与符号重命名)
          cat << 'EOF' > bbr_config.h
          #ifndef _BBR_CONFIG_H
          #define _BBR_CONFIG_H

          // 重命名 minmax 符号以防全局冲突
          #define minmax_running_max bbr_minmax_running_max
          #define minmax_running_min bbr_minmax_running_min
          #define minmax_subwin_update bbr_minmax_subwin_update

          // 打桩 GKI 未导出的 BTF / eBPF 注册函数
          #define register_btf_kfunc_id_set(...) (0)
          #define unregister_btf_kfunc_id_set(...) ((void)0)

          #endif
          EOF

          # 3. 构造 Makefile (使用 -include 自动注入配置，并采用多文件协同编译)
          cat << 'EOF' > Makefile
          obj-m += tcp_bbr.o
          tcp_bbr-y := tcp_bbr_main.o minmax.o
          ccflags-y += -include $(src)/bbr_config.h
          EOF

          # 4. 执行内核模块编译
          KDIR=/opt/ddk/kdir/${{ matrix.kmi }}
          make -C $KDIR M=$WORKDIR modules

          # 5. 收集产物并 Strip 调试符号
          OUT_DIR=/github/workspace/out
          mkdir -p $OUT_DIR
          OUTPUT_NAME="${{ matrix.kmi }}_tcp_bbr.ko"

          cp tcp_bbr.ko "$OUT_DIR/$OUTPUT_NAME"
          llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"

          echo "=== Build succeeded: $OUT_DIR/$OUTPUT_NAME ==="

      - name: Upload tcp_bbr.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr-${{ matrix.kmi }}
          path: /github/workspace/out/${{ matrix.kmi }}_tcp_bbr.ko
