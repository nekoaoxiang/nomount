name: Build BBR LKM Modules

on:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260313'
        type: string
  workflow_call:
    inputs:
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260313'
        type: string

jobs:
  build-bbr:
    name: Build BBR (${{ matrix.variant }}) for ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android14-6.1
        variant:
          - v1
          - v3
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release || '20260313' }}

    steps:
      - name: Build tcp_bbr module
        run: |
          set -euo pipefail
          VARIANT="${{ matrix.variant }}"
          KMI="${{ matrix.kmi }}"

          echo "=== Building self-contained BBR ($VARIANT) for KMI: $KMI ==="

          WORKDIR=/tmp/bbr_build
          rm -rf $WORKDIR
          mkdir -p $WORKDIR
          cd $WORKDIR

          SRC_BASE=/opt/ddk/src/$KMI

          # 1. 根据变体分支选择源码来源 (均保留代码内部 .name = "bbr")
          if [ "$VARIANT" = "v1" ]; then
              cp $SRC_BASE/net/ipv4/tcp_bbr.c ./tcp_bbr_main.c
          elif [ "$VARIANT" = "v3" ]; then
              git clone --depth 1 -b v3 https://github.com/google/bbr.git /tmp/google_bbr
              cp /tmp/google_bbr/net/ipv4/tcp_bbr.c ./tcp_bbr_main.c
          fi

          # 2. 查找并复制 minmax 算法源码
          MINMAX_SRC=$(find $SRC_BASE -type f \( -name "minmax.c" -o -name "win_minmax.c" \) | head -n 1)
          if [ -z "$MINMAX_SRC" ]; then
              echo "ERROR: Could not find minmax source file in $SRC_BASE!"
              exit 1
          fi
          cp "$MINMAX_SRC" ./minmax.c

          # 3. 注入头文件 (重命名 minmax 符号 + 打桩 GKI 未导出的 BTF 函数)
          cat << 'EOF' > bbr_config.h
          #ifndef _BBR_CONFIG_H
          #define _BBR_CONFIG_H

          #define minmax_running_max bbr_minmax_running_max
          #define minmax_running_min bbr_minmax_running_min
          #define minmax_subwin_update bbr_minmax_subwin_update

          #define register_btf_kfunc_id_set(...) (0)
          #define unregister_btf_kfunc_id_set(...) ((void)0)

          #endif
          EOF

          # 4. 生成统一 Makefile (内部模块名始终保持为 tcp_bbr)
          cat << 'EOF' > Makefile
          obj-m += tcp_bbr.o
          tcp_bbr-y := tcp_bbr_main.o minmax.o
          ccflags-y += -include $(src)/bbr_config.h
          EOF

          # 5. 执行编译
          KDIR=/opt/ddk/kdir/$KMI
          make -C $KDIR M=$WORKDIR modules

          # 6. 收集产物并通过文件名区分 v1 与 v3
          OUT_DIR=/github/workspace/out
          mkdir -p $OUT_DIR

          if [ "$VARIANT" = "v1" ]; then
              OUTPUT_NAME="${KMI}_tcp_bbr.ko"
          else
              OUTPUT_NAME="${KMI}_tcp_bbr_v3.ko"
          fi

          cp tcp_bbr.ko "$OUT_DIR/$OUTPUT_NAME"
          llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"

          echo "=== Successfully built $VARIANT -> $OUT_DIR/$OUTPUT_NAME ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp_bbr-${{ matrix.variant }}-${{ matrix.kmi }}
          path: /github/workspace/out/*.ko
